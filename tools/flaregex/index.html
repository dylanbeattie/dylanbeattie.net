<!DOCTYPE html>
<html>

<head>
  <title>Flaregex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html {
      font-family: sans-serif;
    }

    form {
      max-width: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.25em;

      label {
        flex: none;
        font-weight: bold;
      }

      input {
        min-width: 0;
        border-radius: 4px;
        border: 1px solid #000;
        padding: 0.5rem;
      }

      #regex {
        flex: 1 1 auto;
      }

      #count {
        flex: 0 0 2em;
      }
    }
    div#loading {
      padding: 1em;
    }

    input,
    ol {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 120%;

      @media(width < 600px) {
        font-size: 150%;
      }
    }

    ol {
      li::marker {
        font-size: 0.6em;
        font-family: sans-serif;
        padding-right: 1rem;
      }
    }
  </style>
</head>

<body>
  <form>
    <label for="regex">Regex:</label>
    <input type="text" autocorrect="off" autocapitalize="none" spellcheck="false" autocomplete="off" id="regex"
      value="hello.*" />
    <label for="count">Count:</label>
    <input type="text" autocorrect="off" autocapitalize="none" spellcheck="false" autocomplete="off" id="count" />
  </form>
  <marquee id="loading">Loading word list...</marquee>
  <ol></ol>

  <script src="module.js" type="module">

  </script>
</body>

</html>
